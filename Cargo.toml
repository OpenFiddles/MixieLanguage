[package]
name = "mixieland"
version = "0.1.0"
edition = "2021"
description = "The Rust implementation of the MixieLand toolchain"
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mixie"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
