name: MixieLand Rust CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo check --release --lib --target wasm32-unknown-unknown
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: mixie}
          - {name: Windows x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: mixie.exe}
          - {name: macOS ARM64, os: macos-latest, target: aarch64-apple-darwin, binary: mixie}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mixie-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
